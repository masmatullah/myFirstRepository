<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .main{
            height: 800px;
            width: 800px;
            border: 2px solid black;
            background-color: gray;
        }
        #er{
            width: 200px;
            height: 200px;
            border: 2px solid black;
            animation: ali 2s infinite alternate;
            transform: rotate(45deg);
            transition: 2s;
            
        }
        @keyframes ali{
            from{
                background-color: rgb(98, 7, 208);
                background-color: black;
                background-color: deeppink;
            }
            to{
                background-color: rgb(231, 130, 5);
                background-color: greenyellow;
            }
        }
        .we{
            height: 50px;
            width: 50%;
            border: 2px solid black;
            background-color: blue;
            animation: asad 2s infinite alternate;
            
        }
        @keyframes asad{
            from{
                background-color: rgb(57, 35, 2);

            }
            to{
                background-color: rgb(192, 113, 11);
            }
        }
        .one{
            height: 200px;
            width: 200px;
            border-radius: 1000px;
            border: 3px solid black;
            background-color: brown;
            scrollbar-width: 200px;
            transform: rotate(45deg);
            transform: scale(2s);
            animation: 2s saad infinite alternate;
        }
        @keyframes saad{
            from{
                background-color: darkgreen;
            }
            to{
                background-color: mediumorchid ;
            }
        }
        .two{
            height: 50px;
            width: 400px;
            border: 2px solid black;
            background-color: red;
            animation: 2s sameer infinite alternate;

        }
        @keyframes sameer{
            from{
                background-color: orange;
                background-color: black;
            }
            to{
                background-color: rgb(229, 18, 6);
            
            }
        }
        #three{
            height: 200px;
            width: 200px;
            box-shadow: 3cm;
            border: 1px solid black;
            background-color: crimson;
            transform: rotate(36deg);
            animation: 2s ahmad alternate infinite;
            animation-fill-mode: forwards;
        }
        @keyframes ahmad{
            from{
                background-color: darkorange;
                background-color: mediumblue;
            }
            to{
                background-color: rgb(229, 18, 6);
                background-color: tomato;
            }
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<body><div class="main">
    <div id="er"></div>
    <div class="we"></div>
    <div class="one"></div>
    <div class="two"></div>
    <div id="three"></div>
    </div>
</body>
</html>
